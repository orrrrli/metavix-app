name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # Only app code is reviewed — CI/config changes (.github/**, root configs) are
    # intentionally excluded to avoid the workflow reviewing edits to itself.
    paths:
      - 'src/**'
      - 'e2e/**'

concurrency:
  group: opencode-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write # required by anomalyco/opencode/github for OIDC auth — do not remove
      contents: read
      pull-requests: write # lets the action post the review as a PR comment
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Read review prompt
        id: prompt
        run: |
          {
            echo 'text<<EOF'
            cat .github/opencode-review-prompt.md
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - uses: anomalyco/opencode/github@66fdd51f0d6db8e47e876721c855ea155043b74c
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode-go/minimax-m3
          prompt: ${{ steps.prompt.outputs.text }}
